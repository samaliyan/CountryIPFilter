# Every push: tests. A push whose commit message contains [release]:
# builds CountryIPFilter-Setup-<version>.exe (version from the VERSION file)
# and publishes it as a GitHub Release.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: |
          chmod +x build.sh
          ./build.sh "${{ steps.v.outputs.version }}"
      - name: Release
        if: contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Country IP Filter ${{ steps.v.outputs.version }}
          body: |
            Download CountryIPFilter-Setup-${{ steps.v.outputs.version }}.exe and run it. It installs the program to C:\Program Files\CountryIPFilter, with shortcuts in the Start menu and on the Desktop. Remove it in Settings, Apps.
          files: dist/CountryIPFilter-Setup-${{ steps.v.outputs.version }}.exe
